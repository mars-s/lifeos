[project]
name = "lifeos-mcp"
version = "0.1.0"
description = "A local-first MCP coordination layer for Things 3 and Apple Calendar"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "Avi" }]
dependencies = [
    "fastmcp>=3.0.0,<4",
    "pydantic>=2.10.0,<3",
    "things-py==0.0.15",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
lifeos-mcp = "lifeos.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifeos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["cloud-mirror"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
